<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="SubmitGame Claude vs ChatGPT catalog — vibecoded browser games with screenshots, scores, and play links." />
  <meta name="theme-color" content="#0b0f19" />
  <title>Claude vs ChatGPT — Browser-Game Receipts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <div>
          <h1>Claude vs ChatGPT</h1>
          <p class="tagline">SubmitGame catalog — Claude vs ChatGPT browser-game receipts</p>
        </div>
      </div>
      <nav class="header-links">
        <a class="btn ghost" href="https://github.com/SubmitGame/Claude-vs-ChatGPT" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </nav>
    </div>
    <div class="toolbar">
      <div class="stats" id="stats">Loading…</div>
      <div class="controls">
        <label class="search-wrap">
          <span class="sr-only">Search games</span>
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search titles…" autocomplete="off" />
        </label>
        <label class="sort-wrap">
          <span class="sr-only">Sort by</span>
          <select id="sort">
            <option value="score">Score ↓</option>
            <option value="title">Title A–Z</option>
            <option value="newest">Newest</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main>
    <div id="grid" class="grid" role="list"></div>
    <p id="empty" class="empty hidden">No games match your search.</p>
  </main>

  <footer class="site-footer">
    <p>
      SubmitGame gallery · screenshot scores are visual polish only (1–10), not gameplay ratings.
      <a href="https://github.com/SubmitGame/Claude-vs-ChatGPT">Contribute on GitHub</a>
    </p>
    <p class="meta" id="meta"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
